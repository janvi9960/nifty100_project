# Sprint 3 - Screener Configuration
# Analyst-editable threshold definitions

filters:
  roe_min:
    column: return_on_equity
    operator: ">="

  de_max:
    column: debt_to_equity
    operator: "<="

  fcf_min:
    column: free_cash_flow
    operator: ">="

  revenue_cagr_5yr_min:
    column: revenue_cagr_5yr
    operator: ">="

  pat_cagr_5yr_min:
    column: pat_cagr_5yr
    operator: ">="

  opm_min:
    column: operating_profit_margin
    operator: ">="

  pe_max:
    column: pe_ratio
    operator: "<="

  pb_max:
    column: pb_ratio
    operator: "<="

  dividend_yield_min:
    column: dividend_yield_pct
    operator: ">="

  icr_min:
    column: interest_coverage
    operator: ">="

  market_cap_min:
    column: market_cap_crore
    operator: ">="

  net_profit_min:
    column: net_profit
    operator: ">="

  eps_cagr_min:
    column: eps_cagr_5yr
    operator: ">="

  asset_turnover_min:
    column: asset_turnover
    operator: ">="

  sales_min:
    column: sales
    operator: ">="


presets:

  Quality Compounder:
    roe_min: 15
    de_max: 1.0
    fcf_min: 0
    revenue_cagr_5yr_min: 10

  Value Pick:
    pe_max: 20
    pb_max: 3.0
    de_max: 2.0
    dividend_yield_min: 1

  Growth Accelerator:
    pat_cagr_5yr_min: 20
    revenue_cagr_5yr_min: 15
    de_max: 2.0

  Dividend Champion:
    dividend_yield_min: 2
    dividend_payout_max: 80
    fcf_min: 0

  Debt-Free Blue Chip:
    de_max: 0
    roe_min: 12
    sales_min: 5000

  Turnaround Watch:
    revenue_cagr_3yr_min: 10
    fcf_min: 0
    de_declining: true


composite_score:
  profitability:
    weight: 35
    roe_weight: 15
    roce_weight: 10
    npm_weight: 10

  cash_quality:
    weight: 30
    fcf_cagr_weight: 15
    cfo_pat_ratio_weight: 10
    fcf_positive_weight: 5

  growth:
    weight: 20
    revenue_cagr_weight: 10
    pat_cagr_weight: 10

  leverage:
    weight: 15
    de_weight: 10
    icr_weight: 5

  normalization:
    method: p10_p90_winsorization
    minimum_score: 0
    maximum_score: 100